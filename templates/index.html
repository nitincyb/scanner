<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VIP Cyber Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --bg: #0b0f19;
      --card: #151d30;
      --border: #243049;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.15);
      --green-border: #059669;
      --orange: #f59e0b;
      --orange-bg: rgba(245, 158, 11, 0.15);
      --orange-border: #d97706;
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.15);
      --red-border: #dc2626;
      --cyan: #00e5ff;
      --pink: #ff007f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: rgba(21, 29, 48, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-pulse {
      width: 10px;
      height: 10px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan);
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.5; } }

    .header-badge {
      font-size: 0.65rem;
      font-weight: 700;
      background: rgba(0, 229, 255, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(0, 229, 255, 0.35);
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .container { max-width: 500px; margin: 0 auto; padding: 14px 14px 60px; }

    /* ── Controls Row ── */
    .controls-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .action-btn {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .action-btn:hover {
      background: #1e293b;
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .action-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
    }
    .action-btn.primary:hover {
      background: #4f46e5;
      color: #fff;
    }

    /* ── Cyber Viewfinder ── */
    .viewfinder-card {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      aspect-ratio: 1 / 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    #camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Cyber Circular Radar Reticle */
    .target-radar {
      position: absolute;
      width: 74%;
      height: 74%;
      border-radius: 50%;
      border: 2px dashed rgba(0, 229, 255, 0.7);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45), 0 0 15px var(--cyan);
      pointer-events: none;
      animation: radarRotate 12s linear infinite;
    }

    @keyframes radarRotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .target-inner-ring {
      position: absolute;
      width: 40%;
      height: 40%;
      border-radius: 50%;
      border: 2px solid rgba(255, 0, 127, 0.6);
      box-shadow: 0 0 10px var(--pink);
      pointer-events: none;
    }

    /* Scanning Laser */
    .scan-laser {
      position: absolute;
      left: 10%;
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent);
      box-shadow: 0 0 12px var(--cyan);
      animation: sweepLaser 2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes sweepLaser {
      0% { top: 15%; opacity: 0.3; }
      50% { top: 85%; opacity: 1; }
      100% { top: 15%; opacity: 0.3; }
    }

    .reticle-label {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 15, 25, 0.9);
      color: var(--cyan);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      border: 1px solid var(--border);
    }

    .flip-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 20;
    }

    /* ── Live Scanner Status Bar ── */
    .scanner-live-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
    }

    /* ── Status Alert Banner ── */
    .status-banner {
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      display: none;
      animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .status-banner.visible { display: block; }
    .status-banner.green { background: var(--green-bg); border: 2px solid var(--green-border); }
    .status-banner.orange { background: var(--orange-bg); border: 2px solid var(--orange-border); }
    .status-banner.red { background: var(--red-bg); border: 2px solid var(--red-border); }

    .status-banner h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .green h3 { color: var(--green); }
    .orange h3 { color: var(--orange); }
    .red h3 { color: var(--red); }
    .status-banner p { font-size: 0.82rem; color: #cbd5e1; line-height: 1.4; }

    /* ── Stats Grid ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 4px;
      text-align: center;
    }
    .stat-num { font-size: 1.3rem; font-weight: 700; color: #fff; line-height: 1; }
    .stat-txt { font-size: 0.58rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }

    /* ── Activity Feed ── */
    .section-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .section-head {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .log-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.82rem;
    }
    .log-row:last-child { border-bottom: none; }
    .log-name { font-weight: 600; color: #fff; }
    .log-badge {
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .log-starter { background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.4); }
    .log-main { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }

    .admin-actions { text-align: center; margin-top: 14px; }
    .reset-btn { background: none; border: 1px solid var(--border); padding: 7px 18px; border-radius: 8px; font-size: 0.72rem; font-weight: 600; color: var(--red); cursor: pointer; }
    .reset-btn:hover { background: var(--red-bg); border-color: var(--red-border); }

    /* Hidden elements */
    #file-upload-input { display: none; }
    #hidden-canvas { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-pulse"></span>
        VIP Cyber Scanner
      </div>
      <span class="header-badge">AI VISION LIVE</span>
    </div>
  </header>

  <div class="container">

    <!-- Top Action Bar (Camera / Upload) -->
    <div class="controls-bar">
      <button class="action-btn primary" onclick="startCamera()">
        📷 Restart Camera
      </button>
      <button class="action-btn" onclick="triggerFileUpload()">
        📁 Upload Pass Image
      </button>
    </div>

    <!-- Live Viewfinder -->
    <div class="viewfinder-card">
      <video id="camera-video" playsinline autoplay muted></video>
      <div class="target-radar"></div>
      <div class="target-inner-ring"></div>
      <div class="scan-laser"></div>
      <div class="reticle-label">ALIGN PASS IN RADAR</div>
      <button class="flip-btn" onclick="flipCamera()">🔄 Flip</button>
    </div>

    <!-- Live Status -->
    <div class="scanner-live-bar" id="scanner-live-bar">
      <span class="logo-pulse"></span>
      <span id="live-status-text">Starting camera feed...</span>
    </div>

    <!-- Status Alert Banner -->
    <div class="status-banner" id="status-banner">
      <h3 id="banner-title"></h3>
      <p id="banner-msg"></p>
    </div>

    <!-- Live Stats -->
    <div class="stats-row">
      <div class="stat-pill"><div class="stat-num" id="stat-total">0</div><div class="stat-txt">Total</div></div>
      <div class="stat-pill"><div class="stat-num" id="stat-starters">0</div><div class="stat-txt">Starters</div></div>
      <div class="stat-pill"><div class="stat-num" id="stat-mains">0</div><div class="stat-txt">Mains</div></div>
      <div class="stat-pill"><div class="stat-num" id="stat-cooldown">0</div><div class="stat-txt">Cooldown</div></div>
    </div>

    <!-- Live Activity -->
    <div class="section-card">
      <div class="section-head">Live Scan Feed</div>
      <div id="activity-feed">
        <p style="color:var(--text-muted);font-size:0.8rem;text-align:center;padding:12px 0;">No meals scanned yet</p>
      </div>
    </div>

    <div class="admin-actions">
      <button class="reset-btn" onclick="resetDatabase()">Reset Database</button>
    </div>

    <input type="file" id="file-upload-input" accept="image/*" onchange="handleUploadedPass(this)">
  </div>

  <canvas id="hidden-canvas"></canvas>

  <script>
    let activeStream = null;
    let cameraMode = "environment";
    let isProcessing = false;
    let scanCooldown = false;
    let attendeesDB = [];

    // 1. Preload local attendees database
    async function loadAttendees() {
      try {
        const res = await fetch('/api/search?q=');
        attendeesDB = await res.json();
      } catch (e) {}
    }
    loadAttendees();

    // 2. Start Camera
    async function startCamera() {
      const video = document.getElementById('camera-video');
      const statusText = document.getElementById('live-status-text');

      if (activeStream) {
        activeStream.getTracks().forEach(t => t.stop());
        activeStream = null;
      }

      statusText.textContent = "Connecting to camera...";

      const attempts = [
        { video: { facingMode: cameraMode, width: { ideal: 1280 } } },
        { video: { facingMode: "user" } },
        { video: true }
      ];

      let stream = null;
      let lastErr = null;

      for (const opt of attempts) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(opt);
          if (stream) break;
        } catch (e) {
          lastErr = e;
          console.warn("Camera attempt failed:", opt, e);
        }
      }

      if (!stream) {
        console.error("Camera error:", lastErr);
        statusText.innerHTML = "<span style='color:var(--red)'>⚠ Camera in use or blocked. Use '📁 Upload Pass Image' or grant permission.</span>";
        return;
      }

      activeStream = stream;
      video.srcObject = stream;
      video.setAttribute("playsinline", true);
      await video.play();

      statusText.innerHTML = "Camera Active — Hold pass inside radar";
      startLiveMatcher();
    }

    function flipCamera() {
      cameraMode = (cameraMode === "environment") ? "user" : "environment";
      startCamera();
    }

    // 3. Realtime Camera Frame Analysis
    function startLiveMatcher() {
      const video = document.getElementById('camera-video');
      const canvas = document.getElementById('hidden-canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      setInterval(async () => {
        if (!activeStream || isProcessing || scanCooldown || video.readyState !== video.HAVE_ENOUGH_DATA) {
          return;
        }

        isProcessing = true;
        canvas.width = 480;
        canvas.height = 480;

        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 640;
        const minDim = Math.min(vw, vh);
        const sx = (vw - minDim) / 2;
        const sy = (vh - minDim) / 2;

        ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 480, 480);

        try {
          const res = await Tesseract.recognize(canvas, 'eng', { logger: () => {} });
          const txt = (res.data.text || '').trim();

          if (txt) {
            const matched = findStudentFromText(txt);
            if (matched) {
              await claimMeal(matched.scan_code || matched.pass_id);
            }
          }
        } catch (err) {
        } finally {
          isProcessing = false;
        }
      }, 500);
    }

    // 4. File Upload & Direct Pass Scan
    function triggerFileUpload() {
      document.getElementById('file-upload-input').click();
    }

    async function handleUploadedPass(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const statusText = document.getElementById('live-status-text');

      statusText.innerHTML = "<span class='logo-pulse'></span> Scanning uploaded pass image...";

      // Check filename directly first (e.g. VC6-0009.png)
      const fname = file.name;
      const cleanName = fname.split('.')[0].toUpperCase();
      const directMatch = attendeesDB.find(x => x.pass_id === cleanName);

      if (directMatch) {
        await claimMeal(directMatch.scan_code || directMatch.pass_id);
        input.value = '';
        return;
      }

      // Perform AI OCR on uploaded pass file
      try {
        const res = await Tesseract.recognize(file, 'eng', { logger: () => {} });
        const txt = (res.data.text || '').trim();

        if (txt) {
          const matched = findStudentFromText(txt);
          if (matched) {
            await claimMeal(matched.scan_code || matched.pass_id);
            input.value = '';
            return;
          }
        }

        // Backend fallback
        const serverRes = await fetch('/api/scan_image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: txt, filename: file.name })
        });
        const serverData = await serverRes.json();
        showBanner(serverData);
        loadStats();
        loadActivity();
      } catch (e) {
        showBanner({ status: 'ERROR', badge_color: 'red', title: 'Upload Scan Error', message: 'Could not read pass image. Try another image.' });
      } finally {
        input.value = '';
      }
    }

    // 5. Matcher Helper
    function findStudentFromText(raw) {
      if (!raw) return null;
      const upper = raw.toUpperCase().replace(/[^A-Z0-9 ]/g, ' ');

      // Match Pass ID: VC6-0001
      const pMatch = upper.match(/VC6\s*0*([1-9][0-9]?)/);
      if (pMatch) {
        const num = String(pMatch[1]).padStart(4, '0');
        const target = 'VC6-' + num;
        const found = attendeesDB.find(x => x.pass_id === target);
        if (found) return found;
      }

      // Match Name
      for (const s of attendeesDB) {
        const sName = s.name.toUpperCase();
        const parts = sName.split(' ').filter(p => p.length > 2);
        if (parts.length > 0 && parts.every(part => upper.includes(part))) {
          return s;
        }
      }
      return null;
    }

    // 6. Claim Meal Action
    async function claimMeal(code) {
      if (scanCooldown) return;
      scanCooldown = true;

      if (navigator.vibrate) navigator.vibrate(140);

      document.getElementById('live-status-text').innerHTML =
        '<span style="color:var(--cyan);font-weight:700;">Pass Recognized — Claiming Meal...</span>';

      try {
        const res = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        showBanner(data);
        loadAttendees();
        loadStats();
        loadActivity();
      } catch (err) {
        showBanner({ status: 'ERROR', badge_color: 'red', title: 'Network Error', message: 'Could not connect to server.' });
      } finally {
        setTimeout(() => {
          scanCooldown = false;
          if (activeStream) {
            document.getElementById('live-status-text').innerHTML = 'Camera Active — Hold pass inside radar';
          }
        }, 2500);
      }
    }

    function showBanner(data) {
      const banner = document.getElementById('status-banner');
      const color = data.badge_color || 'red';
      banner.className = 'status-banner visible ' + color;
      document.getElementById('banner-title').textContent = (color === 'green' ? '✓ ' : color === 'orange' ? '⏳ ' : '✕ ') + (data.title || data.status);
      document.getElementById('banner-msg').textContent = data.message || '';
      banner.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      if (color === 'green') {
        setTimeout(() => { banner.className = 'status-banner'; }, 4000);
      }
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('stat-total').textContent = data.total_attendees;
        document.getElementById('stat-starters').textContent = data.starters_served;
        document.getElementById('stat-mains').textContent = data.mains_served;
        document.getElementById('stat-cooldown').textContent = data.in_cooldown;
      } catch (err) {}
    }

    async function loadActivity() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        const logs = data.recent_logs || [];
        const feed = document.getElementById('activity-feed');
        if (!logs.length) {
          feed.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem;text-align:center;padding:12px 0;">No meals scanned yet</p>';
          return;
        }

        feed.innerHTML = logs.slice(0, 10).map(l => `
          <div class="log-row">
            <div>
              <div class="log-name">${escHtml(l.name)}</div>
              <div style="font-size:0.7rem;color:var(--text-muted);">${l.time.split(' ')[1] || l.time}</div>
            </div>
            <span class="log-badge ${l.meal === 'STARTER' ? 'log-starter' : 'log-main'}">${l.meal}</span>
          </div>
        `).join('');
      } catch (err) {}
    }

    async function resetDatabase() {
      if (!confirm('Reset all meal records? This cannot be undone.')) return;
      try {
        await fetch('/api/reset_db', { method: 'POST' });
        loadStats();
        loadActivity();
      } catch (err) {}
    }

    function escHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    window.addEventListener('DOMContentLoaded', () => {
      loadStats();
      loadActivity();
      startCamera();
      setInterval(loadStats, 4000);
    });
  </script>
</body>
</html>
